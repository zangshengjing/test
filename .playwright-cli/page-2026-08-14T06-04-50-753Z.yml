      - paragraph [ref=e296]: 以 90 分钟周期规划睡眠，用晨光与体温节律唤醒身体。
      - generic [ref=e297]: 睡眠以 90 分钟为一个周期（R90 方案），成年人每天需要 4-6 个周期。 关键建议： 1. 固定起床时间，倒推入睡时间，而非"困了就睡"。 2. 睡前 30 分钟远离蓝光，调暗灯光，让褪黑素分泌。 3. 卧室温度 18 度左右，完全黑暗，安静。 4. 醒来先见自然光 15 分钟，帮助校准生物钟。 对职场人的意义：睡好觉 = 第二天的专注力、情绪稳定与免疫力。
